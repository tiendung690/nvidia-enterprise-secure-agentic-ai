name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Secret and runtime validation
        run: python scripts/validate_repo.py
      - name: Corpus audit
        run: python scripts/audit_corpus.py
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Deterministic static quality
        run: python scripts/static_quality.py
      - name: Ruff
        run: ruff check src scripts tests
      - name: Mypy
        run: mypy src/nvidia_agentic_rag/agents src/nvidia_agentic_rag/identity src/nvidia_agentic_rag/policy src/nvidia_agentic_rag/context src/nvidia_agentic_rag/security src/nvidia_agentic_rag/data src/nvidia_agentic_rag/audit src/nvidia_agentic_rag/grounding src/nvidia_agentic_rag/rag/provenance.py src/nvidia_agentic_rag/schemas.py
      - name: Unit tests and core coverage
        run: pytest -m 'not live'
