apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ai
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-ai
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: agentic-ai-config
            - secretRef:
                name: agentic-runtime
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: rag-storage
              mountPath: /app/storage
            - name: lakehouse
              mountPath: /app/data/lakehouse
              readOnly: true
      volumes:
        - name: rag-storage
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.ragClaim }}
        - name: lakehouse
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.lakehouseClaim }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentic-ai
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
