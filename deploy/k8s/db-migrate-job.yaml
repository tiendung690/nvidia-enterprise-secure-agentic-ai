apiVersion: batch/v1
kind: Job
metadata:
  name: agentic-db-migrate-${JOB_SUFFIX}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ${IMAGE_REF}
          command: ["python", "scripts/migrate_postgres.py"]
          envFrom:
            - secretRef:
                name: agentic-migration
