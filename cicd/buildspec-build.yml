version: 0.2

env:
  shell: bash
  exported-variables:
    - IMAGE_TAG
    - IMAGE_DIGEST
    - IMAGE_REPOSITORY
    - IMAGE_REF

phases:
  pre_build:
    commands:
      - set -euo pipefail
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION:0:12}"
      - IMAGE_REPOSITORY="$ECR_REPOSITORY_URI"
  build:
    commands:
      - |
        EXISTING_DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY_NAME" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
        if [ -n "$EXISTING_DIGEST" ] && [ "$EXISTING_DIGEST" != "None" ]; then
          echo "Immutable image already exists for commit $IMAGE_TAG; reusing $EXISTING_DIGEST"
        else
          docker build --pull -f Dockerfile.aws -t "$IMAGE_REPOSITORY:$IMAGE_TAG" .
          docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"
        fi
      - IMAGE_DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY_NAME" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
      - test -n "$IMAGE_DIGEST" && test "$IMAGE_DIGEST" != "None"
      - |
        echo "Waiting for ECR vulnerability scan..."
        SCAN_STATUS=""

        for attempt in $(seq 1 30); do
          SCAN_STATUS=$(aws ecr describe-image-scan-findings             --repository-name "$ECR_REPOSITORY_NAME"             --image-id imageTag="$IMAGE_TAG"             --query 'imageScanStatus.status'             --output text 2>/dev/null || true)

          echo "scan attempt=$attempt status=${SCAN_STATUS:-NOT_READY}"

          if [ "$SCAN_STATUS" = "COMPLETE" ]; then
            break
          fi

          if [ "$SCAN_STATUS" = "FAILED" ]; then
            echo "ECR vulnerability scan failed"
            exit 1
          fi

          sleep 5
        done

        test "$SCAN_STATUS" = "COMPLETE" || {
          echo "ECR vulnerability scan did not complete in time"
          exit 1
        }

        CRITICAL_CVES=$(aws ecr describe-image-scan-findings           --repository-name "$ECR_REPOSITORY_NAME"           --image-id imageTag="$IMAGE_TAG"           --query 'imageScanFindings.findings[?severity==`CRITICAL`].name'           --output text)

        CRITICAL_COUNT=$(printf '%s\n' "$CRITICAL_CVES" | wc -w)
        echo "CRITICAL_COUNT=$CRITICAL_COUNT"
        echo "CRITICAL_CVES=${CRITICAL_CVES:-none}"

        if [ "$CRITICAL_COUNT" -gt 0 ]; then
          if [ "${SECURITY_GATE_PROFILE:-strict}" != "lab" ]; then
            echo "Blocking release: CRITICAL vulnerabilities exist"
            exit 1
          fi

          for CVE in $CRITICAL_CVES; do
            case ",${ALLOWED_CRITICAL_CVES:-}," in
              *",$CVE,"*) echo "LAB WAIVER accepted: $CVE" ;;
              *)
                echo "Blocking release: unexpected CRITICAL CVE $CVE"
                exit 1
                ;;
            esac
          done

          echo "LAB SECURITY WAIVER ACTIVE - production remains strict"
        fi
      - IMAGE_REF="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"
      - printf 'IMAGE_REPOSITORY=%s\nIMAGE_TAG=%s\nIMAGE_DIGEST=%s\nIMAGE_REF=%s\n' "$IMAGE_REPOSITORY" "$IMAGE_TAG" "$IMAGE_DIGEST" "$IMAGE_REF" > release.env
  post_build:
    commands:
      - echo "Built immutable image $IMAGE_REF"

artifacts:
  files:
    - release.env
    - deploy/helm/**/*
    - deploy/k8s/**/*
    - scripts/aws/**/*
    - cicd/buildspec-deploy.yml
    - cicd/buildspec-evaluate.yml
  discard-paths: no
